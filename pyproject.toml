[project]
name = "jrl-impute"
version = "0.1.0"
description = "Spatially varying Richardson-Lucy deconvolution with PSF fields imputed from sparse beads"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "scikit-image>=0.22",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "pooch>=1.8",
    "tifffile>=2024.1",
    "tabulate>=0.9",
    "zarr>=2.18,<3",
    "numcodecs<0.16",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
